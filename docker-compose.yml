# Local development database (MySQL 8.4, same engine as OVH).
# Start: docker compose up -d db      Stop: docker compose down
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smartpower
      MYSQL_USER: smartpower
      MYSQL_PASSWORD: smartpower
      MYSQL_ROOT_PASSWORD: root-local-only
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usmartpower", "-psmartpower"]
      interval: 5s
      retries: 30

volumes:
  mysqldata:
